# Source registry. Every observation on the map points to one of these
# entries through its source_id. Licences were checked on the dates given;
# see docs/WQL-002-report.md for what is still unconfirmed.
#
# Evidence grades use the six WQL-001 dimensions (section 2.3), each A to D.
# The grade shown on the map is the weakest of the six, used as a flag, never
# as a score. Grades here are source-level defaults; the pipeline lowers
# individual dimensions per cell where it knows more (for example the
# location precision of conflict events).

[ghsl_pop_2020]
name = "GHS-POP R2023A, epoch 2020"
publisher = "European Commission, Joint Research Centre (GHSL)"
url = "https://human-settlement.emergency.copernicus.eu/download.php?ds=pop"
download = "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2020_GLOBE_R2023A_4326_30ss/V1-0/tiles/GHS_POP_E2020_GLOBE_R2023A_4326_30ss_V1_0_{tile}.zip"
tiles = ["R9_C22", "R10_C22"]
licence = "Reuse authorised provided the source is acknowledged (Commission Decision 2011/833/EU on the reuse of Commission documents); licensed under CC BY 4.0"
licence_url = "https://data.jrc.ec.europa.eu/dataset/2ff68a52-5b5b-4a22-8f40-c41da8332cfe"
licence_checked = "2026-11-26: JRC dataset record (release review) and copyright.txt in the download folder"
citation = "Schiavina M., Freire S., Carioli A., MacManus K. (2023): GHS-POP R2023A - GHS population grid multitemporal (1975-2030). European Commission, Joint Research Centre. doi:10.2905/2FF68A52-5B5B-4A22-8F40-C41DA8332CFE"
native_grain = "30 arc-second raster (about 0.93 km at the equator), WGS84; JRC's own resampling of the 100 m / 1 km Mollweide product"
reference_period = ["2020-01-01", "2020-12-31"]
status = "modelled"
grade = { recency = "B", directness = "C", spatial_fidelity = "A", coverage = "A", validation = "B", interval = "D" }
grade_notes = "Modelled from census counts disaggregated onto built-up surface. No per-pixel interval is published. Recency is lowered per cell where the country's census inputs are old (see kno.census_age)."

