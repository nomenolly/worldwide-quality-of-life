[ghsl_pop_2020_global]
name = "GHS-POP R2023A, epoch 2020, global 30 arc-second mosaic"
publisher = "European Commission, Joint Research Centre (GHSL)"
url = "https://human-settlement.emergency.copernicus.eu/download.php?ds=pop"
download = "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2020_GLOBE_R2023A_4326_30ss/V1-0/GHS_POP_E2020_GLOBE_R2023A_4326_30ss_V1_0.zip"
fetch = "file"
folder = "ghsl_global"
raster = "GHS_POP_E2020_GLOBE_R2023A_4326_30ss_V1_0.tif"
licence = "Reuse authorised provided the source is acknowledged (Commission Decision 2011/833/EU on the reuse of Commission documents); licensed under CC BY 4.0"
licence_url = "https://data.jrc.ec.europa.eu/dataset/2ff68a52-5b5b-4a22-8f40-c41da8332cfe"
licence_checked = "2026-11-26: JRC dataset record (release review) and copyright.txt in the download folder"
citation = "Schiavina M., Freire S., Carioli A., MacManus K. (2023): GHS-POP R2023A - GHS population grid multitemporal (1975-2030). European Commission, Joint Research Centre. doi:10.2905/2FF68A52-5B5B-4A22-8F40-C41DA8332CFE"
native_grain = "30 arc-second raster (about 0.93 km at the equator, narrower towards the poles), WGS84; JRC's own resampling of the 100 m / 1 km Mollweide product"
reference_period = ["2020-01-01", "2020-12-31"]
status = "modelled"
grade = { recency = "B", directness = "C", spatial_fidelity = "A", coverage = "A", validation = "B", interval = "D" }
grade_notes = "Modelled from census counts disaggregated onto built-up surface. No per-pixel interval is published. GHSL writes 0 both on unpopulated land and on open water, so a zero here does not say whether the place is land (see the land-surface layer). Recency is not yet lowered per country for old censuses in the global build: that needs the census-recency layer, which is registered but not yet ingested globally."
