status = "measured"
grade = { recency = "A", directness = "B", spatial_fidelity = "B", coverage = "C", validation = "B", interval = "B" }
grade_notes = "Event-coded from news and NGO reporting, so it records reported organised violence with at least one death, not all violence. Coverage is weakest where reporting is weakest. Deaths carry low, best and high estimates."

