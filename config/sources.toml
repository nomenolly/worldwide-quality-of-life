licence = "CC BY 4.0"
licence_checked = "2026-11-26, per WQL-001 section 4.6"
citation = "Sundberg, Ralph, and Erik Melander, 2013, 'Introducing the UCDP Georeferenced Event Dataset', Journal of Peace Research 50(4): 523-532. Högbladh, Stina, 2026, 'UCDP GED Codebook version 26.1', Department of Peace and Conflict Research, Uppsala University."
native_grain = "Event points with a location precision code (1 exact, 2 within 25 km, 3 ADM2, 4 ADM1, 5 linear or fuzzy feature, 6 country, 7 international waters)"
