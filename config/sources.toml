variants = ["Motorized_Travel_Time_to_Healthcare", "Walking_Only_Travel_Time_To_Healthcare"]
licence = "CC BY 3.0 Unported"
licence_checked = "2026-11-26, per WQL-001 section 4.6"
citation = "Weiss D.J., Nelson A., Vargas-Ruiz C.A., et al. (2020). Global maps of travel time to healthcare facilities. Nature Medicine 26, 1835-1838. doi:10.1038/s41591-020-1059-1"
native_grain = "30 arc-second raster (about 0.93 km), WGS84"
